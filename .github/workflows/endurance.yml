name: Endurance

# Manual dispatch only. An endurance run occupies a runner for its whole duration,
# so triggering it from push or pull_request would bill hours of CI to every commit
# and every review round. Issue #18 requires this separation explicitly.
#
# GitHub-hosted jobs are capped at 6 hours, so the 8h and 24h tiers cannot run
# there. They require a self-hosted runner (or a local machine); the preflight step
# below refuses them rather than letting the job be killed at the cap, which would
# report a truncated run as a failure instead of as "never completed".
on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Endurance tier'
        required: true
        default: '1h'
        type: choice
        options: ['smoke', '1h', '8h', '24h']
      runner:
        description: 'Runner label (must be self-hosted for 8h/24h)'
        required: true
        default: 'windows-11-arm'
        type: string
      self_hosted:
        description: 'Set true if the runner label above is self-hosted'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Never cancel a run in progress: a partial endurance run is worthless as evidence,
# and cancelling one silently produces exactly that. Keyed on the runner alone, not
# the tier, so two different tiers cannot run concurrently on the same self-hosted
# machine and corrupt each other's measurements.
concurrency:
  group: endurance-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  endurance:
    runs-on: ${{ inputs.runner }}
    # 24h plus setup, teardown and the host's own 60s graceful-shutdown budget.
    timeout-minutes: 1560
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — refuse tiers this runner cannot finish
        id: preflight
        shell: bash
        run: |
          tier='${{ inputs.tier }}'
          # Decided from the runner GitHub actually assigned, not from the
          # self_hosted input: trusting the input would let `tier=24h` plus
          # `runner=ubuntu-latest` plus `self_hosted=true` start a run that gets
          # killed at the 6 hour cap -- reporting a truncated run as a failure
          # instead of as one that never completed, which is the exact confusion
          # this step exists to prevent. The input is advisory only.
          environment='${{ runner.environment }}'
          echo "runner.environment=$environment (self_hosted input was '${{ inputs.self_hosted }}')"
          if [[ "$tier" == "8h" || "$tier" == "24h" ]] && [[ "$environment" != "self-hosted" ]]; then
            echo "::error::Tier $tier exceeds the 6 hour GitHub-hosted job cap and this is a $environment runner."
            echo "Dispatch it on a self-hosted runner, or run it locally:"
            echo "  node test/bench/endurance.mjs --tier=$tier"
            echo "A run killed at the cap is not a failed endurance test, it is an unrun one,"
            echo "and must not be reported as either."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Endurance (${{ inputs.tier }})
        id: run
        # continue-on-error so the time series and the RESULT line are still
        # uploaded and readable when a threshold is breached -- a breach is the
        # interesting outcome, and losing its evidence would be worse than the
        # red X. The reporting step below is the actual gate.
        continue-on-error: true
        # bash on every platform: the default shell on Windows runners is
        # pwsh, where `tee` resolves to Tee-Object. It happens to work, but
        # mixing shells implicitly across steps is how a pipeline's exit status
        # ends up meaning something different per OS.
        shell: bash
        run: node test/bench/endurance.mjs --tier=${{ inputs.tier }} | tee endurance-output.txt

      - name: Upload time series and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-${{ inputs.tier }}-${{ inputs.runner }}
          path: |
            artifacts/
            endurance-output.txt
          if-no-files-found: warn

      - name: Report completion honestly
        # Skipped when preflight refused the tier: there is no RESULT to report,
        # and emitting "no RESULT line" there would mask the real reason.
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          # `completed` distinguishes a run that finished its requested duration
          # from one that was cut short. Reporting the tier without it would let a
          # truncated run be read as a pass.
          node -e '
            const fs = require("fs");
            const text = fs.existsSync("endurance-output.txt") ? fs.readFileSync("endurance-output.txt", "utf8") : "";
            const line = text.split(/\r?\n/).find(l => l.startsWith("RESULT "));
            if (!line) { console.log("::error::no RESULT line; the run did not report"); process.exit(1); }
            const r = JSON.parse(line.slice(7));
            console.log(`tier=${r.tier} requested=${r.requestedMinutes}m actual=${r.actualMinutes}m completed=${r.completed}`);
            console.log(`node=${r.node} ${r.platform}/${r.arch} samples=${r.samples} series=${r.seriesPath}`);
            console.log(`measurement=${JSON.stringify(r.measurement)}`);
            console.log(`breaches=${JSON.stringify(r.breaches)}`);
            if (!r.completed) {
              console.log(`::error::run did NOT complete: ${JSON.stringify(r.aborted)}`);
              process.exit(1);
            }
            if (r.breaches.length) {
              console.log(`::error::${r.breaches.length} threshold breach(es)`);
              process.exit(1);
            }
          '
